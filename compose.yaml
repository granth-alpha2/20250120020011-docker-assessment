services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-festpass}
      POSTGRES_USER: ${DB_USER:-festpass}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    environment:
      REGNO: ${REGNO:-NOT-SET}
      APP_VERSION: ${APP_VERSION:-dev}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-festpass}
      DB_USER: ${DB_USER:-festpass}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - edge
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  edge:
  data:
    internal: true
